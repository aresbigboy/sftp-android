apply plugin: 'com.android.application'

android {
    namespace 'com.example.lansftp'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.lansftp"
        minSdk 26
        targetSdk 33
        versionCode 25
        versionName "1.0.24"
    }

    signingConfigs {
        release {
            storeFile file('../lansftp-release.keystore')
            storePassword 'lansftp123'
            keyAlias 'lansftp'
            keyPassword 'lansftp123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/INDEX.LIST',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/versions/9/module-info.class',
                    'META-INF/io.netty.versions.properties'
            ]
        }
        jniLibs {
            // 关键：必须把 jniLibs 里的 .so 解压为独立文件并保留可执行权限。
            // extractNativeLibs=false（AGP 默认）时 .so 只留在 APK 内可 dlopen、
            // 但不可 execve，rsync 二进制将无法执行（表现为 exec request failed）。
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Apache MINA SSHD：纯 Java 实现 SSH/SFTP 服务端
    implementation 'org.apache.sshd:sshd-core:2.12.0'
    implementation 'org.apache.sshd:sshd-sftp:2.12.0'
    // BouncyCastle：补齐 Android 上缺失的加密算法
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    // SLF4J Android 绑定：日志输出到 logcat
    implementation 'org.slf4j:slf4j-android:1.7.36'
}
